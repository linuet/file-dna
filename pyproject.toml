[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "file-dna"
version = "0.2.0"
description = "Analyze a folder's file DNA: duplicates, similarity clusters, anomalies and an HTML map."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "linuet"}]
keywords = ["files", "duplicates", "similarity", "simhash", "cli", "analysis"]

[project.scripts]
file-dna = "file_dna.cli:main"

[tool.setuptools.packages.find]
include = ["file_dna*"]
